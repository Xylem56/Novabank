<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>First Bank</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;--bg2:#111827;--bg3:#1a2235;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f4ff;--text2:#8898b0;--text3:#5a6a80;
  --accent:#3b82f6;--accent2:#1d4ed8;
  --green:#22c55e;--red:#ef4444;--gold:#f59e0b;
  --card:#131c2e;--card2:#0f1724;
  --font:'DM Sans',sans-serif;--serif:'DM Serif Display',serif;
  --sidebar:240px;--bottom-bar:64px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font)}


::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}


.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden;padding:24px}
.login-glow{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,0.08) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:48px 40px;position:relative;z-index:1}
@media(max-width:480px){.login-card{padding:32px 24px}}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:36px}
.logo-mark{background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{fill:white}
.logo-mark.lg{width:40px;height:40px}.logo-mark.lg svg{width:22px;height:22px}
.logo-mark.sm{width:34px;height:34px}.logo-mark.sm svg{width:18px;height:18px}
.logo-name{font-family:var(--serif);color:var(--text)}
.logo-name.lg{font-size:24px}.logo-name.sm{font-size:20px}
.login-title{font-size:22px;font-weight:600;margin-bottom:6px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.form-input{width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--text3)}
select.form-input option{background:var(--bg3);color:var(--text)}
.login-btn{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:10px;font-size:15px;font-weight:500;margin-top:8px;transition:background .2s,transform .1s}
.login-btn:hover{background:#2563eb}
.login-btn:active{transform:scale(.99)}
.error-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:16px}
.hint-box{margin-top:20px;padding:14px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.15);border-radius:10px}
.hint-box p{font-size:12px;color:var(--text2);line-height:1.6}
.hint-box strong{color:var(--accent)}
.auth-switch{margin-top:22px;text-align:center;font-size:13px;color:var(--text2)}
.auth-switch button{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:0 0 0 4px}
.auth-switch button:hover{text-decoration:underline}
.register-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:480px){.register-grid{grid-template-columns:1fr}}


.app{display:flex;min-height:100vh}


.sidebar{width:var(--sidebar);background:var(--card2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;position:fixed;top:0;left:0;height:100vh;z-index:200;transition:transform .3s}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 24px 24px;border-bottom:1px solid var(--border)}
.sidebar-nav{flex:1;padding:20px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav-section{padding:0 12px;margin:12px 0 6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;transition:background .15s;color:var(--text2);font-size:14px;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,.12);color:var(--accent)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{padding:16px 12px 0;border-top:1px solid var(--border)}
.sidebar-user{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px}
.avatar{border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:600;color:white;flex-shrink:0}
.avatar.md{width:34px;height:34px;font-size:13px}
.avatar.lg{width:44px;height:44px;font-size:16px}
.sidebar-user-name{font-size:13px;font-weight:500;color:var(--text)}
.sidebar-user-role{font-size:11px;color:var(--text3)}
.logout-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;color:var(--text3);font-size:13px;cursor:pointer;border-radius:10px;transition:background .15s;margin-top:4px;border:none;background:none;width:100%}
.logout-btn:hover{background:rgba(239,68,68,.08);color:#f87171}
.logout-btn svg{width:16px;height:16px}


.main{margin-left:var(--sidebar);flex:1;padding:32px 36px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.page-title{font-size:22px;font-weight:600}
.page-sub{font-size:13px;color:var(--text3);margin-top:2px}
.notif-btn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.notif-dot{width:7px;height:7px;background:var(--red);border-radius:50%;position:absolute;top:8px;right:8px}
.notif-btn svg{width:18px;height:18px;color:var(--text2)}


.balance-card{background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 50%,#3b82f6 100%);border-radius:20px;padding:32px;margin-bottom:24px;position:relative;overflow:hidden}
.bc-ring{position:absolute;border-radius:50%;background:rgba(255,255,255,0.05)}
.bc-ring.r1{right:-40px;top:-40px;width:240px;height:240px}
.bc-ring.r2{right:60px;top:80px;width:140px;height:140px}
.bal-label{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.6);margin-bottom:8px}
.bal-amount{font-family:var(--serif);font-size:48px;color:white;margin-bottom:4px;letter-spacing:-1px}
.bal-currency{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:28px}
.bal-meta{display:flex;gap:32px;flex-wrap:wrap}
.bal-meta-item label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.5);display:block;margin-bottom:4px}
.bal-meta-item span{font-size:14px;font-weight:500;color:rgba(255,255,255,.9)}
.chip-icon{position:absolute;right:36px;bottom:36px;opacity:.3}


.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px}
.stat-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stat-label{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.07em}
.stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.stat-icon svg{width:17px;height:17px}
.si-green{background:rgba(34,197,94,.12);color:var(--green)}
.si-red{background:rgba(239,68,68,.12);color:var(--red)}
.si-gold{background:rgba(245,158,11,.12);color:var(--gold)}
.stat-amount{font-size:26px;font-weight:600;margin-bottom:6px}
.stat-change{font-size:12px}
.stat-change.up{color:var(--green)}.stat-change.down{color:var(--red)}


.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.action-btn{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:border-color .2s,background .2s}
.action-btn:hover{background:var(--bg3);border-color:var(--accent)}
.action-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.action-icon svg{width:20px;height:20px}
.ai-blue{background:rgba(59,130,246,.12);color:var(--accent)}
.ai-green{background:rgba(34,197,94,.12);color:var(--green)}
.ai-gold{background:rgba(245,158,11,.12);color:var(--gold)}
.ai-red{background:rgba(239,68,68,.12);color:var(--red)}
.action-label{font-size:12px;font-weight:500;color:var(--text2)}

.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:16px;font-weight:600}
.view-all{font-size:13px;color:var(--accent);cursor:pointer;background:none;border:none;padding:0}


.tx-table{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.tx-table-hd{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr .6fr;padding:14px 20px;border-bottom:1px solid var(--border)}
.tx-table-hd span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}
.tx-row{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr .6fr;padding:16px 20px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;transition:background .15s}
.tx-row:last-child{border-bottom:none}
.tx-row:hover{background:var(--bg3)}
.tx-name-wrap{display:flex;align-items:center;gap:12px}
.tx-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--bg3)}
.tx-name{font-size:14px;font-weight:500}
.tx-ref{font-size:11px;color:var(--text3);margin-top:2px}
.tx-date{font-size:13px;color:var(--text2)}
.tx-acct{font-size:12px;color:var(--text3);font-family:monospace}
.tx-amount{font-size:14px;font-weight:600}
.tx-amount.debit{color:var(--red)}.tx-amount.credit{color:var(--green)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge.success{background:rgba(34,197,94,.1);color:var(--green)}
.badge.pending{background:rgba(245,158,11,.1);color:var(--gold)}
.badge.failed{background:rgba(239,68,68,.1);color:var(--red)}

/* ── CARDS PAGE ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:28px}
.bank-card{border-radius:18px;padding:28px;position:relative;overflow:hidden;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.bank-card.blue{background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
.bank-card.dark{background:linear-gradient(135deg,#1a1a2e,#16213e)}
.bank-card.green{background:linear-gradient(135deg,#064e3b,#10b981)}
.bank-card-ring{position:absolute;border-radius:50%;background:rgba(255,255,255,.06)}
.bcr1{width:200px;height:200px;top:-60px;right:-60px}
.bcr2{width:120px;height:120px;top:40px;right:20px}
.card-number{font-family:monospace;font-size:17px;color:rgba(255,255,255,.9);letter-spacing:3px;margin-bottom:20px}
.card-meta{display:flex;justify-content:space-between;align-items:flex-end}
.card-holder{font-size:13px;color:rgba(255,255,255,.7)}
.card-holder strong{display:block;font-size:15px;color:white;font-weight:500}
.card-expiry label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.5)}
.card-expiry span{display:block;font-size:14px;color:white;font-weight:500}
.card-type-badge{position:absolute;top:20px;right:20px;font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
.cards-info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.info-card-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:8px}
.info-card-val{font-size:18px;font-weight:600}
.info-card-sub{font-size:12px;color:var(--text2);margin-top:4px}

/* ── ANALYTICS ── */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.chart-card-title{font-size:14px;font-weight:600;margin-bottom:18px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bar{width:100%;border-radius:6px 6px 0 0;transition:opacity .2s;cursor:pointer;min-height:4px}
.bar:hover{opacity:.8}
.bar-label{font-size:10px;color:var(--text3)}
.pie-wrap{display:flex;gap:20px;align-items:center}
.pie-legend{display:flex;flex-direction:column;gap:10px}
.pie-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.pie-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.spend-list{display:flex;flex-direction:column;gap:12px}
.spend-row{display:flex;align-items:center;gap:12px}
.spend-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--bg3)}
.spend-info{flex:1}
.spend-name{font-size:13px;font-weight:500}
.spend-pct{font-size:11px;color:var(--text3)}
.spend-bar-wrap{flex:1;height:4px;background:var(--bg3);border-radius:4px;overflow:hidden}
.spend-bar{height:100%;border-radius:4px}
.spend-amount{font-size:13px;font-weight:600;color:var(--red)}

/* ── SETTINGS ── */
.settings-layout{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.settings-sidebar{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:8px;position:sticky;top:0}
.settings-nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--text2);transition:background .15s}
.settings-nav-item:hover{background:var(--bg3);color:var(--text)}
.settings-nav-item.active{background:rgba(59,130,246,.12);color:var(--accent)}
.settings-nav-item svg{width:16px;height:16px;flex-shrink:0}
.settings-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px}
.settings-panel-title{font-size:18px;font-weight:600;margin-bottom:6px}
.settings-panel-sub{font-size:14px;color:var(--text2);margin-bottom:28px}
.settings-divider{border:none;border-top:1px solid var(--border);margin:24px 0}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:14px;font-weight:500}
.settings-row-sub{font-size:12px;color:var(--text3);margin-top:3px}
.toggle-wrap{position:relative;width:44px;height:24px;cursor:pointer}
.toggle-wrap input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;border-radius:24px;background:var(--bg3);border:1px solid var(--border2);transition:background .2s}
.toggle-slider::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:var(--text3);top:3px;left:3px;transition:transform .2s,background .2s}
.toggle-wrap input:checked+.toggle-slider{background:rgba(59,130,246,.2);border-color:var(--accent)}
.toggle-wrap input:checked+.toggle-slider::after{transform:translateX(20px);background:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.save-btn{padding:12px 28px;background:var(--accent);color:white;border:none;border-radius:10px;font-size:14px;font-weight:500;transition:background .2s}
.save-btn:hover{background:#2563eb}
.danger-zone{background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:20px}
.danger-title{font-size:14px;font-weight:600;color:var(--red);margin-bottom:6px}
.danger-sub{font-size:13px;color:var(--text2);margin-bottom:14px}
.danger-btn{padding:10px 20px;background:transparent;border:1px solid rgba(239,68,68,.4);color:var(--red);border-radius:10px;font-size:13px;transition:background .2s}
.danger-btn:hover{background:rgba(239,68,68,.1)}
.profile-avatar-section{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.avatar-upload{position:relative}
.avatar-upload .avatar.lg{width:72px;height:72px;font-size:22px}
.avatar-edit-btn{position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;background:var(--accent);border:2px solid var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.avatar-edit-btn svg{width:11px;height:11px;color:white}
.avatar-info h3{font-size:16px;font-weight:600}
.avatar-info p{font-size:13px;color:var(--text2);margin-top:3px}

/* ── TRANSFER MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal-hd{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:600}
.modal-close{width:32px;height:32px;background:var(--bg3);border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close svg{width:16px;height:16px;color:var(--text2)}
.modal-body{padding:28px}
.transfer-steps{display:flex;gap:8px;margin-bottom:24px}
.t-step{flex:1;height:3px;border-radius:3px;background:var(--bg3)}
.t-step.done{background:var(--accent)}
.amount-input-wrap{position:relative;margin-bottom:20px}
.amount-prefix{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:600;color:var(--text2)}
.amount-input{width:100%;padding:16px 16px 16px 40px;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-size:24px;font-weight:600;outline:none;transition:border-color .2s}
.amount-input:focus{border-color:var(--accent)}
.amount-input::placeholder{color:var(--text3)}
.quick-amounts{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.qa-btn{padding:7px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s}
.qa-btn:hover{border-color:var(--accent);color:var(--accent)}
.transfer-summary{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px}
.ts-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.ts-row .k{color:var(--text2)}.ts-row .v{font-weight:500}
.ts-total{border-top:1px solid var(--border);padding-top:10px;margin-top:4px}
.ts-total .k{font-weight:600;color:var(--text)}.ts-total .v{font-size:16px;font-weight:700;color:var(--accent)}
.transfer-btn{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:12px;font-size:15px;font-weight:500;transition:background .2s;margin-top:4px}
.transfer-btn:hover{background:#2563eb}
.transfer-btn:disabled{background:var(--bg3);color:var(--text3);cursor:not-allowed}
.success-screen{text-align:center;padding:20px 0}
.success-icon{width:64px;height:64px;background:rgba(34,197,94,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.success-icon svg{width:30px;height:30px;color:var(--green)}
.success-title{font-size:22px;font-weight:600;margin-bottom:8px}
.success-sub{font-size:14px;color:var(--text2);margin-bottom:24px}
.success-ref{background:var(--bg3);border-radius:10px;padding:12px 16px;font-family:monospace;font-size:13px;color:var(--accent);text-align:center;margin-bottom:24px}

/* ── RECEIPT MODAL ── */
.receipt-hd{background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:28px 28px 24px;border-radius:20px 20px 0 0;text-align:center;position:relative}
.receipt-status-icon{width:54px;height:54px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}

.receipt-close{position:absolute;top:16px;right:16px;width:30px;height:30px;background:rgba(255,255,255,.12);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.receipt-close svg{width:16px;height:16px;color:white}
.r-amount-label{font-size:12px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}

.r-type{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px}
.receipt-body{padding:28px}
.r-row{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.r-row:last-child{border-bottom:none}
.r-key{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.r-val{font-size:13px;font-weight:500;text-align:right;max-width:60%}
.r-divider{border:none;border-top:1px dashed var(--border2);margin:8px 0}
.r-section{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin:16px 0 8px}
.receipt-footer{padding:0 28px 28px}
.r-dl-btn{width:100%;padding:13px;border:1px solid var(--border2);background:transparent;border-radius:10px;color:var(--text2);font-size:14px;transition:background .2s}
.r-dl-btn:hover{background:var(--bg3)}

/* ── BOTTOM TAB BAR (mobile) ── */
.bottom-bar{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottom-bar);background:var(--card2);border-top:1px solid var(--border);z-index:200;padding:0 8px}
.bottom-bar-inner{display:flex;align-items:center;justify-content:space-around;height:100%}
.tab-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;border-radius:10px;cursor:pointer;background:none;border:none;color:var(--text3);transition:color .15s;min-width:56px}
.tab-btn.active{color:var(--accent)}
.tab-btn svg{width:22px;height:22px}
.tab-btn span{font-size:10px;font-weight:500}

const API_URL = "http://localhost:3000";

function authUser(data){
  const user = data.user || {};
  const name = user.name || "New User";
  return {...user, token:data.token, initials:name.split(" ").map(part=>part[0]).join("").slice(0,2).toUpperCase(), accountType:"Personal", accountNumber:"Pending", joined:new Date().toLocaleDateString("en-NG",{month:"short",year:"numeric"})};
}

function Register({onRegistered,onBack}){
  const [form,setForm]=useState({firstName:"",lastName:"",email:"",password:"",dateOfBirth:"",phoneNumber:""});
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const update=event=>setForm({...form,[event.target.name]:event.target.value});
  const submit=()=>{
    if(Object.values(form).some(value=>!value.trim())){setErr("Please fill in all fields.");return;}
    setErr("");setBusy(true);
    fetch(`${API_URL}/auth`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(form)})
      .then(async res=>{const data=await res.json();if(!res.ok)throw new Error(data.message||"Registration failed.");return data;})
      .then(data=>onRegistered(form.email.trim().toLowerCase(),data.message))
      .catch(error=>setErr(error.message||"Could not connect to server."))
      .finally(()=>setBusy(false));
  };
  return <div className="login-wrap"><div className="login-glow"/><div className="login-card">
    <div className="login-logo"><div className="logo-mark lg"><svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.5L20 9v6l-8 4-8-4V9l8-4.5z"/></svg></div><span className="logo-name lg">NovaBank</span></div>

    {err&&<div className="error-box">{err}</div>}

    <div className="form-group"><label className="form-label">Email address</label><input className="form-input" name="email" type="email" placeholder="you@novabank.com" value={form.email} onChange={update}/></div>
    <div className="register-grid"><div className="form-group"><label className="form-label">Date of birth</label><input className="form-input" name="dateOfBirth" type="date" value={form.dateOfBirth} onChange={update}/></div><div className="form-group"><label className="form-label">Phone number</label><input className="form-input" name="phoneNumber" type="tel" placeholder="08012345678" value={form.phoneNumber} onChange={update}/></div></div>
    <div className="form-group"><label className="form-label">Password</label><input className="form-input" name="password" type="password" placeholder="Create a password" value={form.password} onChange={update}/></div>
    <button className="login-btn" onClick={submit} disabled={busy}>{busy?"Creating account…":"Create account"}</button>
    <p className="auth-switch">Already have an account?<button onClick={onBack}>Sign in</button></p>
  </div></div>;
}

function Login({onLogin}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [showRegister,setShowRegister]=useState(false);
  const [registeredMessage,setRegisteredMessage]=useState("");

  if(showRegister) return <Register onBack={()=>setShowRegister(false)} onRegistered={(newEmail,message)=>{setEmail(newEmail);setPass("");setRegisteredMessage(message);setErr("");setShowRegister(false);}}/>;

  const submit = () => {
  if (!email || !pass) { setErr("Please fill in all fields."); return; }
  setErr("");
  
  fetch(`${API_URL}/auth/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email.trim().toLowerCase(), password: pass })
  })
  .then(async res => ({ok:res.ok,data:await res.json()}))
  .then(({ok,data}) => {
    if (!ok) { setErr(data.message||"Invalid credentials"); return; }
    onLogin(authUser(data));
  })
  .catch(() => setErr("Could not connect to server."));
};
  return(
    <div className="login-wrap">
      <div className="login-glow"/>
      <div className="login-card">
        <div className="login-logo">
          <div className="logo-mark lg"><svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.5L20 9v6l-8 4-8-4V9l8-4.5z"/></svg></div>
          <span className="logo-name lg">NovaBank</span>
        </div>
        <h1 className="login-title">Welcome back</h1>
        <p className="login-sub">Sign in to your account to continue</p>
        {registeredMessage&&<div className="hint-box"><p><strong>{registeredMessage}</strong> Sign in with the email you used to register.</p></div>}
        {err&&<div className="error-box">{err}</div>}
        <div className="form-group">
          <label className="form-label">Email address</label>
          <input className="form-input" type="email" placeholder="you@novabank.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
        </div>
        <div className="form-group">
          <label className="form-label">Password</label>
          <input className="form-input" type="password" placeholder="Enter your password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
        </div>
        <button className="login-btn" onClick={submit}>Sign in to NovaBank</button>
        <p className="auth-switch">New to NovaBank?<button onClick={()=>{setRegisteredMessage("");setShowRegister(true)}}>Create an account</button></p>
      </div>
    </div>
  );
  
}

          <div className="r-row"><span className="r-key">Account No.</span><span className="r-val" style={{fontFamily:"monospace"}}>{tx.accountNumber}</span></div>

        <div className="receipt-footer">
          <button className="r-dl-btn">Download Receipt as PDF</button>

      </div>

          {step===2&&<>
            <div className="transfer-summary">
              <div className="ts-row"><span className="k">To</span><span className="v">{acctName}</span></div>
              <div className="ts-row"><span className="k">Bank</span><span className="v">{bank}</span></div>
              <div className="ts-row"><span className="k">Account No.</span><span className="v" style={{fontFamily:"monospace"}}>{acctNo}</span></div>
              <div className="ts-row"><span className="k">Narration</span><span className="v">{narration||"—"}</span></div>
              <div className="ts-row"><span className="k">Amount</span><span className="v">{ngn(amt)}</span></div>
              <div className="ts-row"><span className="k">Fee</span><span className="v">{ngn(fee)}</span></div>
              <div className="ts-row ts-total"><span className="k">Total Debit</span><span className="v">{ngn(amt+fee)}</span></div>
            </div>
            <p style={{fontSize:12,color:"var(--text3)",marginBottom:16}}>By clicking Confirm, you authorise this transfer from your NovaBank account ending <strong style={{color:"var(--text2)"}}>{user.accountNumber.slice(-4)}</strong>.</p>
            <button className="transfer-btn" onClick={confirmTransfer}>Confirm Transfer</button>
            <button style={{width:"100%",marginTop:10,padding:12,background:"none",border:"1px solid var(--border2)",borderRadius:10,color:"var(--text2)",fontSize:14}} onClick={()=>setStep(1)}>Go Back</button>
          </>}
        </div>
      </div>
    </div>
  );
}

function TxTable({txList,onTxClick}){

          <div className="tx-name-wrap">
            <div className="tx-avatar">{tx.avatar}</div>
            <div><p className="tx-name">{tx.name}</p><p className="tx-ref">{tx.ref}</p></div>
          </div>
          <div><p className="tx-date">{tx.date}</p><p className="tx-ref">{tx.time}</p></div>
          <p className="tx-acct">{tx.accountNumber!=="N/A"?tx.accountNumber.slice(-4).padStart(tx.accountNumber.length,"•"):"N/A"}</p>
          <p className={"tx-amount "+(tx.type==="Debit"?"debit":"credit")}>{tx.type==="Debit"?"-":"+"}{ngn(tx.amount)}</p>

function TransactionsPage({txList,onTxClick}){

          <span style={{fontSize:11,color:"var(--text2)",display:"flex",alignItems:"center",gap:5}}><span style={{width:10,height:10,borderRadius:2,background:"var(--red)",display:"inline-block"}}/> Outflow</span>

function SettingsPage({user}){
  const [tab,setTab]=useState("profile");
  const [saved,setSaved]=useState(false);
  const [toggles,setToggles]=useState({emailAlerts:true,smsAlerts:true,pushAlerts:false,loginAlerts:true,txAlerts:true,newsletter:false,twoFA:true,biometrics:false,sessionLock:true});
  const toggle=k=>setToggles(p=>({...p,[k]:!p[k]}));
  const saveAll=()=>{setSaved(true);setTimeout(()=>setSaved(false),2000)};

  const tabs=[{id:"profile",label:"Profile",icon:I.user},{id:"password",label:"Password",icon:I.lock},{id:"notifications",label:"Notifications",icon:I.bell},{id:"security",label:"Security",icon:I.shield}];

  return(<>
    <div className="topbar"><div><h1 className="page-title">Settings</h1><p className="page-sub">Manage your account preferences</p></div></div>
    <div className="settings-layout">
      <div className="settings-sidebar">
        <div className="settings-nav-items">
          {tabs.map(t=>(
            <div key={t.id} className={"settings-nav-item "+(tab===t.id?"active":"")} onClick={()=>setTab(t.id)}>
              {t.icon}<span>{t.label}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="settings-panel">
        {tab==="profile"&&<>
          <h2 className="settings-panel-title">Profile Information</h2>
          <p className="settings-panel-sub">Update your personal details</p>
          <div className="profile-avatar-section">
            <div className="avatar-upload">
              <div className="avatar lg">{user.initials}</div>
              <div className="avatar-edit-btn">{I.edit}</div>
            </div>
            <div className="avatar-info">
              <h3>{user.name}</h3>
              <p>{user.accountType} · Member since {user.joined}</p>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">First Name</label><input className="form-input" defaultValue={user.name.split(" ")[0]}/></div>
            <div className="form-group"><label className="form-label">Last Name</label><input className="form-input" defaultValue={user.name.split(" ")[1]||""}/></div>
          </div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Email</label><input className="form-input" defaultValue={user.email}/></div>
            <div className="form-group"><label className="form-label">Phone</label><input className="form-input" defaultValue={user.phone}/></div>
          </div>
          <div className="form-group"><label className="form-label">Address</label><input className="form-input" placeholder="Enter your address"/></div>
          <button className="save-btn" onClick={saveAll}>{saved?"Saved ✓":"Save Changes"}</button>
        </>}

        {tab==="password"&&<>
          <h2 className="settings-panel-title">Change Password</h2>
          <p className="settings-panel-sub">Choose a strong password to keep your account secure</p>
          <div className="form-group"><label className="form-label">Current Password</label><input className="form-input" type="password" placeholder="Enter current password"/></div>
          <div className="form-group"><label className="form-label">New Password</label><input className="form-input" type="password" placeholder="Min. 8 characters"/></div>
          <div className="form-group"><label className="form-label">Confirm New Password</label><input className="form-input" type="password" placeholder="Repeat new password"/></div>
          <button className="save-btn">Update Password</button>
          <hr className="settings-divider"/>
          <div className="danger-zone">
            <p className="danger-title">Close Account</p>
            <p className="danger-sub">Permanently close your NovaBank account. This cannot be undone.</p>
            <button className="danger-btn">Request Account Closure</button>
          </div>
        </>}

        {tab==="notifications"&&<>
          <h2 className="settings-panel-title">Notification Preferences</h2>
          <p className="settings-panel-sub">Choose how you want to be notified</p>
          {[
            {k:"emailAlerts",label:"Email Alerts",sub:"Receive transaction alerts via email"},
            {k:"smsAlerts",label:"SMS Alerts",sub:"Text message for every transaction"},
            {k:"pushAlerts",label:"Push Notifications",sub:"In-app push notifications"},
            {k:"loginAlerts",label:"Login Alerts",sub:"Alert when account is accessed"},
            {k:"txAlerts",label:"Transaction Summaries",sub:"Weekly spend summary email"},
            {k:"newsletter",label:"NovaBank Updates",sub:"Product news and feature releases"},
          ].map(r=>(
            <div key={r.k} className="settings-row">
              <div className="settings-row-info"><p className="settings-row-label">{r.label}</p><p className="settings-row-sub">{r.sub}</p></div>
              <label className="toggle-wrap"><input type="checkbox" checked={toggles[r.k]} onChange={()=>toggle(r.k)}/><span className="toggle-slider"/></label>
            </div>
          ))}
        </>}

        {tab==="security"&&<>
          <h2 className="settings-panel-title">Security Settings</h2>
          <p className="settings-panel-sub">Control access and authentication for your account</p>
          {[
            {k:"twoFA",label:"Two-Factor Authentication",sub:"Require OTP on every login"},
            {k:"biometrics",label:"Biometric Login",sub:"Use fingerprint or face ID"},
            {k:"sessionLock",label:"Auto Session Lock",sub:"Lock after 5 minutes of inactivity"},
          ].map(r=>(
            <div key={r.k} className="settings-row">
              <div className="settings-row-info"><p className="settings-row-label">{r.label}</p><p className="settings-row-sub">{r.sub}</p></div>
              <label className="toggle-wrap"><input type="checkbox" checked={toggles[r.k]} onChange={()=>toggle(r.k)}/><span className="toggle-slider"/></label>
            </div>
          ))}

          <div className="form-group"><label className="form-label">Transaction PIN</label><input className="form-input" type="password" placeholder="Enter 4-digit PIN" maxLength={4}/></div>
          <button className="save-btn">Update PIN</button>
          <hr className="settings-divider"/>
          <div className="danger-zone">
            <p className="danger-title">Active Sessions</p>
            <p className="danger-sub">You are currently logged in on 1 device. Sign out all other sessions if you suspect unauthorised access.</p>
            <button className="danger-btn">Sign Out All Other Sessions</button>
          </div>
        </>}
      </div>
    </div>
  </>);
}


function App(){
  const [user,setUser]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [selectedTx,setSelectedTx]=useState(null);
  const [showTransfer,setShowTransfer]=useState(false);
  const [txList, setTxList] = useState([]);
useEffect(() => {
  if (!user) return;
  fetch("http://localhost:3000/accounts/transactions", {
    headers: { Authorization: user.token }
  })
    .then(res => res.ok ? res.json() : {transactions: []})
    .then(data => setTxList(Array.isArray(data) ? data : data.transactions || []))
    .catch(err => console.error("Failed to load transactions:", err));
}, [user]);

  const navItems=[
    {id:"dashboard",label:"Home",icon:I.grid},
    {id:"cards",label:"Cards",icon:I.card},
    {id:"transactions",label:"Transfers",icon:I.tx},
    {id:"analytics",label:"Analytics",icon:I.chart},
    {id:"settings",label:"Settings",icon:I.cog},
  ];

  if(!user) return <Login onLogin={u=>{setUser(u);}}/>;

  const renderPage=()=>{
    switch(page){
      case "dashboard": return <DashboardPage user={user} txList={txList} onTxClick={setSelectedTx} onTransfer={()=>setShowTransfer(true)}/>;
      case "transactions": return <TransactionsPage txList={txList} onTxClick={setSelectedTx}/>;
      case "cards": return <CardsPage user={user}/>;
      case "analytics": return <AnalyticsPage/>;
      case "settings": return <SettingsPage user={user}/>;
      default: return null;
    }
  };

  return(
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          <div className="logo-mark sm"><svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.5L20 9v6l-8 4-8-4V9l8-4.5z"/></svg></div>
          <span className="logo-name sm">NovaBank</span>
        </div>
        <nav className="sidebar-nav">
          <p className="nav-section">Main</p>
          {navItems.slice(0,3).map(n=>(
            <div key={n.id} className={"nav-item "+(page===n.id?"active":"")} onClick={()=>setPage(n.id)}>
              {n.icon}{n.label}
            </div>
          ))}
          <p className="nav-section">Reports</p>
          {navItems.slice(3).map(n=>(
            <div key={n.id} className={"nav-item "+(page===n.id?"active":"")} onClick={()=>setPage(n.id)}>
              {n.icon}{n.label}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="sidebar-user">
            <div className="avatar md">{user.initials}</div>
            <div><div className="sidebar-user-name">{user.name}</div><div className="sidebar-user-role">{user.accountType}</div></div>
          </div>
          <button className="logout-btn" onClick={()=>setUser(null)}>{I.out}Sign out</button>
        </div>
      </aside>

      <main className="main">{renderPage()}</main>

      
      <nav className="bottom-bar">
        <div className="bottom-bar-inner">
          {navItems.map(n=>(
            <button key={n.id} className={"tab-btn "+(page===n.id?"active":"")} onClick={()=>setPage(n.id)}>
              {n.icon}<span>{n.label}</span>
            </button>
          ))}
        </div>
      </nav>

      {selectedTx&&<Receipt tx={selectedTx} user={user} onClose={()=>setSelectedTx(null)}/>}
      {showTransfer&&<TransferModal user={user} onClose={()=>setShowTransfer(false)} onSuccess={()=>{}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
